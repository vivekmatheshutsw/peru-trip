<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#1f2a27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peru Trip">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Peru Trip</title>
<style>
:root{--bg:#1f2a27;--card:#26332f;--ink:#f3f1ec;--muted:#a9b5af;--accent:#e09a5a;--warn:#ef8a78;--line:#3a4a45;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.box{width:100%;max-width:360px;display:grid;gap:16px;text-align:center}
.icon{width:72px;height:72px;border-radius:18px;margin:0 auto;display:block}
h1{font-family:Georgia,serif;font-weight:400;font-size:28px;margin:0}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
form{display:grid;gap:10px}
input[type=password]{font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.row input{width:18px;height:18px;accent-color:var(--accent)}
button{font:inherit;font-weight:600;font-size:16px;padding:13px;border-radius:12px;border:0;background:var(--accent);color:#1f2a27;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--warn);font-size:14px;min-height:20px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<main class="box" id="box">
  <img class="icon" src="icon-192.png" alt="">
  <h1>Peru Trip</h1>
  <p id="msg">Enter the trip password to open the app.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="Peru Trip" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <label class="row" for="rem"><input id="rem" type="checkbox" checked> Remember on this device</label>
    <button id="go" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
(function () {
  const P = __PAYLOAD__, SALT = __SALT__, ITER = __ITER__, KEY = 'peru.key';
  const $ = id => document.getElementById(id);
  if (!P) {
    $('msg').textContent = 'This app isn’t set up yet. Check back soon.';
    $('f').hidden = true; return;
  }
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
  }
  async function open(raw) {
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.data));
    const html = new TextDecoder().decode(out);
    document.open(); document.write(html); document.close();
  }
  const store = {
    get() { try { return localStorage.getItem(KEY) } catch (e) { return null } },
    set(v) { try { localStorage.setItem(KEY, v) } catch (e) {} },
    del() { try { localStorage.removeItem(KEY) } catch (e) {} }
  };
  const saved = store.get();
  if (saved) {
    open(b64(saved)).catch(() => { store.del(); $('msg').textContent = 'The password changed. Enter the new one.'; });
  }
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('pw').value; if (!pw) return;
    $('go').disabled = true; $('go').textContent = 'Unlocking…'; $('err').textContent = '';
    try {
      const remember = $('rem').checked;
      const raw = await derive(pw);
      await open(raw); // replaces this page with the trip, so read the checkbox first
      if (remember) store.set(btoa(String.fromCharCode(...raw)));
    } catch (err) {
      $('err').textContent = 'That password didn’t work. Try again.';
      $('go').disabled = false; $('go').textContent = 'Unlock';
      const box = $('box'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      $('pw').select();
    }
  });
})();
</script>
</body>
</html>
