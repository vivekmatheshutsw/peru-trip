# Netlify runs build.js, which encrypts the trip with the TRIP_PASSWORD
# environment variable (set in Netlify, never stored here) and writes dist/.
[build]
  command = "node build.js"
  publish = "dist"

# Always check for a fresh offline worker so phones get updates quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Ask search engines not to list or archive any page of this site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
