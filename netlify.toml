# No build step: Netlify publishes the files in this folder as they are.
[build]
  publish = "."

# Always check for a fresh offline worker so phones get updates quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Ask search engines not to list or archive any page of this site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
